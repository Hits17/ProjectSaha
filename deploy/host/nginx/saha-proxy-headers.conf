proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Replace client-supplied chains; do not append attacker-controlled values.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $saha_forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $saha_forwarded_port;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP $saha_edge_ip;
