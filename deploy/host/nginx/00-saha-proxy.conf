# Included at nginx http scope. Only local cloudflared may supply edge headers.
geo $saha_tunnel_peer {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map "$saha_tunnel_peer:$http_x_forwarded_proto" $saha_forwarded_proto {
    default $scheme;
    "1:https" https;
}
map $saha_tunnel_peer $saha_edge_ip {
    default "";
    1 $http_cf_connecting_ip;
}
map $saha_forwarded_proto $saha_forwarded_port {
    default $server_port;
    https 443;
}
map $http_upgrade $saha_connection_upgrade {
    default upgrade;
    "" close;
}
# Exclude query strings and Referer: verification links/SSE tickets are secrets.
log_format saha_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
